apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-1
spec: 
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/data

---
apiVersion: v1
kind: PersistentVolumeClaim 
metadata:
  name: pvc-1
spec: 
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 1Gi
  volumeName: pv-1
  volumeMode: Filesystem


---
apiVersion: v1
kind: Pod
metadata:
  name: pvc-pod
spec:
  containers: 
    - name: pod-1
      image: nginx:latest
      command: ["sleep", "36000"]
      volumeMounts:
      - mountPath: /data
        name: vol-pvc
  volumes:
  - name: vol-pvc
    persistentVolumeClaim:
      claimName: pvc-1

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  replicas: 1
  selector: 
    matchLabels: 
      app: nginx
  template:
    metadata:
      labels: 
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx
          command: ["sleep", "3600"]
          # volumeMounts:
          # - mountPath: /data
          #   name: dep-vol
          resources:
            requests:
              cpu: "50m"
            limits:
              cpu: "150m"
          ports:
          - containerPort: 80
      # volumes:
      #   - name: dep-vol
      #     persistentVolumeClaim:
      #       claimName: pvc-1
      
---

apiVersion: v1
kind: Service
metadata: 
  name: nginx-svc
  labels:
    app: nginx
spec:
  type: NodePort
  ports:
    - port: 80
      nodePort: 31215
      targetPort: 80
  selector:
    app: nginx

        