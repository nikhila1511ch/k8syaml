apiVersion: v1
kind: Service
metadata:
  name: service-np
  namespace: frontend
  labels:
    env: ui
spec: 
  type: NodePort
  selector:
    env: ui
  ports: 
  - port: 80
    nodePort: 31212
    targetPort: 80


---
apiVersion: v1
kind: Service
metadata:
  name: service-lb
  namespace: frontend
  labels:
    env: ui
spec: 
  type: LoadBalancer
  selector:
    env: ui
  ports:
  - port: 80
    targetPort: 80



  
