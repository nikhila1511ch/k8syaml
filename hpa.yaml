apiVersion: apps/v1
kind: deployment
metadata:
  name: nginx
  lables:
    app: nginx
spec:
  replicas: 1
  selector: 
    matchLabels: 
      name: nginx
  template:
    metadata:
      name: nginx
      labels: 
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx
        resources:
          requests:
            cpu: "50m"
          limits:
            cpu: "150m"
        ports:
        - containerPort: 80

---

apiVersion: v1
kind: service
metadata: 
  name: nginx
  labels:
    app: nginx
spec:
  type: LoadBalancer
  - port: 80
    target: 80
  selector:
    app: nginx
